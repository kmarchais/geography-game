name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: true

env:
  VITE_ATLAS_BUILD: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run validate-total-rounds
      - run: bunx eslint --config eslint.config.cjs src/globe src/views/GlobeGame.vue src/components/EarthGlobe.vue src/components/auth server tests/globe tests/server scripts/generate-icons.mjs
      - run: bun run type-check
      - run: bun run test
      - run: bun run test:ranking
      - run: bunx playwright install --with-deps chromium
      # Tests use their own in-memory API, never the live ranking database.
      - run: bun run test:globe
        timeout-minutes: 10
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globe-browser-report
          path: playwright-report/globe/
          retention-days: 14
      - name: Build the original website
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/3d-globe')
        env:
          BASE_URL: /geography-game/
          VITE_ATLAS_API_URL: ${{ vars.ATLAS_API_URL }}
        run: |
          node --input-type=module -e "if (!process.env.VITE_ATLAS_API_URL || new URL(process.env.VITE_ATLAS_API_URL).protocol !== 'https:') throw Error('Set the ATLAS_API_URL repository variable to the HTTPS ranking API.')"
          bun run build
          cp dist/index.html dist/404.html
      - name: Upload website artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/3d-globe')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/3d-globe')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to the original GitHub Pages address
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ATLAS_API_URL: ${{ vars.ATLAS_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bun run build:android
      - name: Compile debug APK
        working-directory: android
        run: bash gradlew :app:assembleDebug --console=plain --no-daemon --max-workers=2
      - name: Record build source
        run: |
          node scripts/source-manifest.mjs android-source-manifest.json
          git rev-parse HEAD > android-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-source-manifest.json
            android-source-commit.txt
          retention-days: 14
