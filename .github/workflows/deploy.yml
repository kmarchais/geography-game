name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Verification scope
        type: choice
        options: [all, hosting]
        default: all

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: true

env:
  VITE_ATLAS_BUILD: ${{ github.sha }}

jobs:
  build:
    if: github.event.inputs.target != 'hosting'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run validate-total-rounds
      - run: bunx eslint --config eslint.config.cjs src/globe src/views/GlobeGame.vue src/components/EarthGlobe.vue src/components/BugReportDialog.vue src/components/auth server tests/globe tests/server scripts/generate-icons.mjs scripts/prepare-country-names.mjs
      - run: bun run type-check
      - run: bun run test
      - run: bun run test:ranking
      - run: google-chrome --version
      # Tests use their own in-memory API, never the live ranking database.
      - run: bun run test:globe
        timeout-minutes: 15
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globe-browser-report
          path: playwright-report/globe/
          retention-days: 14
      - name: Build the original website
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/3d-globe')
        env:
          BASE_URL: /geography-game/
          VITE_ATLAS_API_URL: ${{ vars.ATLAS_API_URL }}
        run: |
          node --input-type=module -e "if (!process.env.VITE_ATLAS_API_URL || new URL(process.env.VITE_ATLAS_API_URL).protocol !== 'https:') throw Error('Set the ATLAS_API_URL repository variable to the HTTPS ranking API.')"
          bun run build
          cp dist/index.html dist/404.html
      - name: Upload website artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/3d-globe')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/3d-globe')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to the original GitHub Pages address
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'hosting'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ATLAS_API_URL: ${{ vars.ATLAS_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bun run build:android
      - name: Compile debug APK
        working-directory: android
        run: bash gradlew :app:assembleDebug --console=plain --no-daemon --max-workers=2
      - name: Record build source
        run: |
          node scripts/source-manifest.mjs android-source-manifest.json
          git rev-parse HEAD > android-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-source-manifest.json
            android-source-commit.txt
          retention-days: 14

  hosting:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Build the Railway image
        run: docker build --build-arg ATLAS_BUILD=${{ github.sha }} -t atlas-hosting .
      - name: Verify hosting integration in the production image
        run: docker run --rm --entrypoint node --mount type=bind,src="$PWD/tests",dst=/app/tests,readonly atlas-hosting --test tests/server/static.test.mjs
      - name: Check the production website and durable API
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-data"
          docker run -d --name atlas-hosting -p 127.0.0.1:4180:8080 -e PORT=8080 -e RAILWAY_ENVIRONMENT_ID=test -e RAILWAY_VOLUME_MOUNT_PATH=/data -e RAILWAY_PUBLIC_DOMAIN=atlas.example --mount type=bind,src="$RUNNER_TEMP/atlas-data",dst=/data atlas-hosting
          node tests/server/container-smoke.mjs start
          docker restart atlas-hosting
          node tests/server/container-smoke.mjs verify
      - name: Check the actual production UI with unavailable Google configuration
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: node scripts/check-hosted-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosting-ui
          path: .local/hosting-ui/
      - name: Container logs
        if: always()
        run: docker logs atlas-hosting || true
      - name: Verify the Cloudflare runtime with an isolated local database
        run: |
          docker cp atlas-hosting:/app/dist ./dist
          npx --yes wrangler@4.153.0 dev --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/atlas-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/atlas-api/health; then break; fi
            sleep 1
          done
          ATLAS_WORKER_TEST_URL=http://127.0.0.1:8787 node --test tests/server/cloudflare-runtime.test.mjs
          cat "$RUNNER_TEMP/atlas-worker.log"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-cloudflare-web
          path: dist/
          retention-days: 14
